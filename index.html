<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35000f"><title>恋ばこ</title>
<style>
:root{--wine:#690020;--deep:#31000f;--dark:#160007;--gold:#d8a638;--lg:#ffe7a1;--cream:#fff9eb;--line:rgba(255,223,135,.7);--panel:rgba(48,0,16,.94)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;padding-bottom:78px;color:var(--cream);background:linear-gradient(rgba(20,0,8,.12),rgba(20,0,8,.9)),url("file_00000000187481f897c170cd1a77aa0f.png") center top/cover fixed no-repeat;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 13px;background:rgba(43,0,15,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.logo{color:var(--lg);font-size:25px;font-weight:700}.currency{font:12px sans-serif;color:var(--lg)}.page{width:min(100%,980px);margin:auto;padding:17px 14px 32px}.section,.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(91,0,31,.95),rgba(30,0,10,.97));box-shadow:0 20px 55px rgba(0,0,0,.45);border-radius:22px}.section{padding:18px 15px;margin:15px 0}.title{margin:0 0 15px;text-align:center;color:var(--lg)}.gold,.outline{min-height:46px;border-radius:999px;font-weight:700}.gold{border:1px solid #fff1af;color:#500016;background:linear-gradient(#fff7c8,#ecc553 55%,#b97512)}.outline{border:1px solid var(--line);color:var(--lg);background:linear-gradient(180deg,rgba(90,0,30,.95),rgba(45,0,16,.98))}.field{width:100%;padding:13px;border:1px solid rgba(255,225,143,.55);border-radius:13px;outline:0;color:#fff;background:rgba(15,0,6,.8);font:16px sans-serif}.field:focus{border-color:#ffe39a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.work{overflow:hidden;border:1px solid rgba(255,224,141,.5);border-radius:16px;background:rgba(255,255,255,.05)}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#21000c}.work-body{padding:10px}.small{font:11px sans-serif;color:#d8c4cb}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border:1px solid rgba(255,225,143,.4);border-radius:999px;color:var(--lg);background:rgba(0,0,0,.18);font:11px sans-serif}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(53,0,19,.98);border-top:1px solid var(--line)}.nav{min-height:68px;border:0;color:#ceb9c1;background:transparent;font-size:10px}.nav.active{color:var(--lg);background:linear-gradient(rgba(255,219,108,.14),transparent)}.auth,.name-screen,.curtain{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:linear-gradient(rgba(10,0,5,.55),rgba(10,0,5,.95)),url("file_00000000187481f897c170cd1a77aa0f.png") center/cover}.auth-box{width:min(100%,430px);padding:24px;border:1px solid var(--line);border-radius:27px;background:rgba(48,0,16,.97);text-align:center}.google{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;color:#fff3cf;background:linear-gradient(180deg,rgba(90,0,30,.95),rgba(45,0,16,.98));font-family:sans-serif;font-weight:700}.curtain{display:block;overflow:hidden;background:#130005}.curtain::before,.curtain::after{content:"";position:absolute;top:0;bottom:0;width:52%;background-image:url("assets/curtain.jpg");background-size:200% 100%;transition:transform 1.8s cubic-bezier(.65,0,.25,1);filter:saturate(1.1) contrast(1.05);box-shadow:inset 0 0 80px #120003}.curtain::before{left:0;background-position:left}.curtain::after{right:0;background-position:right}.curtain.open::before{transform:translateX(-100%)}.curtain.open::after{transform:translateX(100%)}.curtain-center{position:absolute;z-index:2;left:50%;bottom:11%;transform:translateX(-50%);width:min(90%,560px);padding:18px;text-align:center;border:1px solid var(--line);border-radius:28px;background:rgba(48,0,16,.94)}.modal{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.84)}.modal.show{display:flex}.modal-box{width:min(100%,620px);max-height:90vh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#5e0022,#21000c)}.chat{display:flex;flex-direction:column;gap:12px;max-height:58vh;overflow:auto;padding:6px}.bubble{padding:13px;border-radius:16px;white-space:pre-wrap;line-height:1.8}.user-b{align-self:flex-end;background:#70445a}.ai-b{align-self:flex-start;background:#2a0714;border:1px solid rgba(255,225,143,.3)}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tool{padding:6px 8px;border:1px solid rgba(255,225,143,.35);border-radius:9px;color:var(--lg);background:#31000f;font-size:11px}.composer{position:sticky;bottom:0;padding-top:9px;background:#21000c}.gacha-machine{position:relative;width:min(100%,360px);height:480px;margin:auto}.gacha-top{position:absolute;left:35px;right:35px;top:0;height:250px;border:5px solid #b88a39;border-radius:45% 45% 25% 25%;background:rgba(255,255,255,.18);overflow:hidden;backdrop-filter:blur(2px)}.capsule{position:absolute;width:52px;height:38px;border-radius:999px;background:linear-gradient(90deg,#fff 50%,#d83955 50%);border:2px solid rgba(255,255,255,.65);transition:transform .7s}.gacha-bottom{position:absolute;left:55px;right:55px;top:220px;height:230px;border-radius:30px 30px 18px 18px;background:linear-gradient(#b6002e,#680017);border:5px solid #d7a641;box-shadow:0 20px 35px rgba(0,0,0,.5)}.handle{position:absolute;left:50%;top:285px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;border:8px solid #e7c46b;background:#40111d;transition:transform 1s}.handle::after{content:"";position:absolute;left:35px;top:-20px;width:16px;height:48px;border-radius:10px;background:#ffe5a0}.gacha-machine.spinning .handle{transform:translateX(-50%) rotate(720deg)}.gacha-machine.spinning .capsule{transform:translate(var(--x),var(--y)) rotate(540deg)}.exit{position:absolute;left:50%;top:393px;transform:translateX(-50%);width:82px;height:48px;border-radius:10px;background:#24000b;border:3px solid #d7a641}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs img{width:86px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<div id="loading" class="auth">開演準備中…</div>
<section id="auth" class="auth hidden"><div class="auth-box"><h1 style="color:var(--lg);font-size:38px">恋ばこ</h1><p>恋と物語が集まる劇場へようこそ</p><button id="google" class="google">G　Googleで続ける</button><p>── または ──</p><input id="email" class="field" type="email" placeholder="メールアドレス"><br><br><input id="password" class="field" type="password" placeholder="パスワード（6文字以上）"><br><br><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="login" class="gold">ログイン</button><button id="signup" class="outline">新規登録</button></div><p id="authMsg" class="small"></p></div></section>
<section id="nameScreen" class="name-screen hidden"><div class="auth-box"><h2 class="title">あなたのお名前</h2><p>恋ばこで使う活動名を決めてください</p><input id="displayName" class="field" maxlength="24" placeholder="例：もえの"><br><br><button id="saveName" class="gold" style="width:100%">この名前で入場する</button></div></section>
<section id="curtain" class="curtain hidden"><div class="curtain-center"><h1 style="color:var(--lg)">恋ばこ</h1><p>まもなく、あなたの物語が開演いたします</p><button id="enter" class="gold">入場する</button></div></section>
<header class="top"><div class="logo">恋ばこ</div><div id="topName" class="small"></div><div id="wallet" class="currency">⭐0　🎫0</div></header>
<main id="home" class="page"><section class="section"><h1 class="title">おかえりなさい</h1><p style="text-align:center;line-height:1.9">ここは、恋と夢と希望が集まる劇場。<br>今日も、あなたの物語が始まります。</p><div class="chips"><button class="chip" data-genre="すべて">すべて</button><button class="chip" data-genre="恋">恋</button><button class="chip" data-genre="夢">夢</button><button class="chip" data-genre="ホラー">ホラー</button><button class="chip" data-genre="女性向け">女性向け</button></div></section><section class="section"><h2 class="title">新着作品</h2><div id="worksGrid" class="grid"></div></section></main>
<main id="create" class="page hidden"><section class="section"><h2 class="title">作品を作る</h2><select id="postType" class="field"><option value="chat">AIチャット作品</option><option value="image">画像だけ投稿</option></select><br><br><input id="title" class="field" maxlength="60" placeholder="作品タイトル"><br><br><input id="characterName" class="field" maxlength="40" placeholder="キャラクター名"><br><br><select id="genre" class="field"><option value="恋">恋</option><option value="夢">夢</option><option value="希望">希望</option><option value="癒やし">癒やし</option><option value="ホラー">ホラー</option><option value="ミステリー">ミステリー</option><option value="女性向け">女性向け</option><option value="男性向け">男性向け</option><option value="その他">その他</option></select><br><br><textarea id="intro" class="field" rows="4" placeholder="キャラクター紹介"></textarea><br><br><textarea id="personality" class="field" rows="4" placeholder="性格・話し方"></textarea><br><br><textarea id="story" class="field" rows="7" placeholder="背景設定・物語"></textarea><br><br><textarea id="relationship" class="field" rows="3" placeholder="主人公との関係"></textarea><br><br><textarea id="greeting" class="field" rows="5" placeholder="最初のメッセージ"></textarea><br><br><textarea id="examples" class="field" rows="5" placeholder="会話スタイル例"></textarea><br><br><input id="cover" class="field" type="file" accept="image/*"><br><br><label>シーン画像（複数可）</label><input id="scenes" class="field" type="file" accept="image/*" multiple><div id="scenePreview" class="thumbs" style="margin-top:8px"></div><br><select id="status" class="field"><option value="公開">公開</option><option value="非公開">非公開</option></select><br><br><button id="publish" class="gold" style="width:100%">保存する</button><p id="saveMsg" class="small"></p></section></main>
<main id="gacha" class="page hidden"><section class="section"><h2 class="title">恋ばこカプセルトイ</h2><div id="machine" class="gacha-machine"><div class="gacha-top"><i class="capsule" style="left:35px;top:35px;--x:80px;--y:90px"></i><i class="capsule" style="left:130px;top:70px;--x:-70px;--y:70px"></i><i class="capsule" style="left:200px;top:35px;--x:-90px;--y:120px"></i><i class="capsule" style="left:85px;top:145px;--x:90px;--y:-80px"></i></div><div class="gacha-bottom"></div><button id="spin" class="handle" aria-label="回す"></button><div class="exit"></div></div><p style="text-align:center">回すボタンを押すとチケットを1枚使います</p><div id="gachaResult" class="section hidden"></div></section></main>
<main id="mypage" class="page hidden"><section class="section"><h2 id="myName" class="title">観客</h2><p id="myEmail" class="small" style="text-align:center"></p><div style="display:grid;gap:8px"><button id="editName" class="outline">名前を変更</button><button id="logout" class="outline">ログアウト</button></div></section><section class="section"><h2 class="title">私の投稿</h2><div id="myGrid" class="grid"></div></section></main>
<nav class="bottom"><button class="nav active" data-page="home">🏛️<br>ホーム</button><button class="nav" data-page="create">✍️<br>投稿</button><button class="nav" data-page="gacha">🎁<br>ガチャ</button><button class="nav" data-page="mypage">🌹<br>マイページ</button><button id="soundToggle" class="nav">🔊<br>音</button></nav>
<div id="modal" class="modal"><div class="modal-box"><button id="closeModal" class="outline" style="float:right;min-height:36px">×</button><div id="modalBody"></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithRedirect,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,getDoc,addDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-functions.js';
const firebaseConfig={apiKey:'AIzaSyCeGBhIN06rgVwC2AFH5uJAFWBEnimtvX8',authDomain:'koibakoapp.firebaseapp.com',projectId:'koibakoapp',storageBucket:'koibakoapp.firebasestorage.app',messagingSenderId:'227394461437',appId:'1:227394461437:web:e677c23c2bbf80bbf5a894',measurementId:'G-137XD9EBN3'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),functions=getFunctions(app,'asia-northeast1');const $=id=>document.getElementById(id);let user=null,profile={},works=[],sound=true,activeWork=null,activeChat=crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function page(name){['home','create','gacha','mypage'].forEach(x=>$(x).classList.toggle('hidden',x!==name));document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));scrollTo(0,0)}document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));
async function upload(file,path){if(!file)return'';const r=ref(storage,path);await uploadBytes(r,file,{contentType:file.type});return getDownloadURL(r)}
function announce(){if(!sound)return;const a=new Audio('assets/announcement.mp3');a.play().catch(()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('皆さま、本日は恋ばこ劇場へお越しいただき、ありがとうございます。まもなく、あなたの物語が開演いたします。どうぞ、ごゆっくりお楽しみください。');u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)})}
$('enter').onclick=()=>{announce();$('curtain').classList.add('open');setTimeout(()=>$('curtain').classList.add('hidden'),1900)};$('soundToggle').onclick=()=>{sound=!sound;$('soundToggle').innerHTML=(sound?'🔊':'🔇')+'<br>音'};
$('google').onclick=()=>signInWithRedirect(auth,new GoogleAuthProvider());$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authMsg').textContent=e.message}};$('signup').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authMsg').textContent=e.message}};$('logout').onclick=()=>signOut(auth);
$('saveName').onclick=async()=>{const name=$('displayName').value.trim();if(!name)return alert('名前を入力してください。');await setDoc(doc(db,'users',user.uid),{displayName:name,email:user.email||'',coins:100,tickets:1,createdAt:serverTimestamp()},{merge:true});profile={...profile,displayName:name,coins:profile.coins??100,tickets:profile.tickets??1};$('nameScreen').classList.add('hidden');$('curtain').classList.remove('hidden');renderProfile()};$('editName').onclick=()=>{$('displayName').value=profile.displayName||'';$('nameScreen').classList.remove('hidden')};
onAuthStateChanged(auth,async u=>{user=u;$('loading').classList.add('hidden');if(!u){$('auth').classList.remove('hidden');return}$('auth').classList.add('hidden');const p=await getDoc(doc(db,'users',u.uid));profile=p.exists()?p.data():{};if(!profile.displayName){$('nameScreen').classList.remove('hidden')}else{$('curtain').classList.remove('hidden')}renderProfile();startWorks()});
function renderProfile(){$('topName').textContent=profile.displayName||'';$('myName').textContent=profile.displayName||'観客';$('myEmail').textContent=user?.email||'';$('wallet').textContent=`⭐ ${profile.coins||0}　🎫 ${profile.tickets||0}`}
function startWorks(){onSnapshot(query(collection(db,'works'),orderBy('updatedAt','desc')),s=>{works=s.docs.map(d=>({id:d.id,...d.data()}));renderWorks()})}
function card(w,manage=false){return`<article class="work">${w.coverUrl?`<img class="cover" src="${esc(w.coverUrl)}">`:`<div class="cover" style="display:grid;place-items:center;font-size:50px">🎭</div>`}<div class="work-body"><span class="chip">${esc(w.genre)}</span><h3>${esc(w.title)}</h3><p class="small">${esc(w.intro)}</p><p class="small">演者：${esc(w.ownerName)}</p><button class="outline open" data-id="${w.id}" style="width:100%">${manage?'確認':'開く'}</button></div></article>`}
function renderWorks(){const pub=works.filter(w=>w.status==='公開');$('worksGrid').innerHTML=pub.length?pub.map(w=>card(w)).join(''):'<p>まだ公開作品がありません。</p>';$('myGrid').innerHTML=works.filter(w=>w.ownerId===user?.uid).map(w=>card(w,true)).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openWork(works.find(w=>w.id===b.dataset.id)))}
document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{const g=b.dataset.genre;const list=works.filter(w=>w.status==='公開'&&(g==='すべて'||w.genre===g));$('worksGrid').innerHTML=list.map(w=>card(w)).join('');document.querySelectorAll('.open').forEach(x=>x.onclick=()=>openWork(works.find(w=>w.id===x.dataset.id))) });
$('scenes').onchange=()=>{$('scenePreview').innerHTML=[...$('scenes').files].map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')};
$('publish').onclick=async()=>{if(!user)return;const id=crypto.randomUUID();$('saveMsg').textContent='保存中…';try{const cover=await upload($('cover').files[0],`users/${user.uid}/works/${id}/cover`);const sceneUrls=[];for(const [i,f] of [...$('scenes').files].entries())sceneUrls.push(await upload(f,`users/${user.uid}/works/${id}/scene-${i}`));const data={ownerId:user.uid,ownerName:profile.displayName,title:$('title').value.trim(),characterName:$('characterName').value.trim(),genre:$('genre').value,intro:$('intro').value.trim(),personality:$('personality').value.trim(),story:$('story').value.trim(),relationship:$('relationship').value.trim(),greeting:$('greeting').value.trim(),examples:$('examples').value.trim(),type:$('postType').value,status:$('status').value,coverUrl:cover,sceneUrls,updatedAt:serverTimestamp()};if(!data.title||!data.intro)return alert('タイトルと紹介を入力してください。');await setDoc(doc(db,'works',id),data);$('saveMsg').textContent='保存しました。';page('mypage')}catch(e){$('saveMsg').textContent=e.message}};
function openWork(w){activeWork=w;activeChat=crypto.randomUUID();$('modalBody').innerHTML=`<h2>${esc(w.title)}</h2>${w.coverUrl?`<img class="cover" style="max-width:270px;display:block;margin:auto" src="${esc(w.coverUrl)}">`:''}<p style="white-space:pre-wrap;line-height:1.8">${esc(w.intro)}\n\n${esc(w.story)}</p><div class="thumbs">${(w.sceneUrls||[]).map(x=>`<img src="${esc(x)}">`).join('')}</div>${w.type==='image'?'':`<button id="startChat" class="gold" style="width:100%;margin-top:14px">新しいチャット</button>`}`;$('modal').classList.add('show');setTimeout(()=>{const b=$('startChat');if(b)b.onclick=()=>chatScreen(w)},0)}
function chatScreen(w){$('modalBody').innerHTML=`<h2>${esc(w.characterName||w.title)}</h2><div id="chat" class="chat"><div class="bubble ai-b">${esc(w.greeting||'物語を始めよう。')}</div></div><div class="composer"><select id="length" class="field"><option value="normal">通常</option><option value="long">長め</option><option value="x2">2倍（コイン2）</option><option value="x3">3倍（コイン5）</option><option value="x5">5倍（コイン8）</option></select><br><br><textarea id="chatInput" class="field" rows="3" placeholder="あなたの言葉を入力"></textarea><br><br><button id="send" class="gold" style="width:100%">送信</button></div>`;$('send').onclick=()=>sendChat(w)}
async function sendChat(w,regenerateFrom=''){const text=$('chatInput').value.trim();if(!text)return;const c=$('chat');c.insertAdjacentHTML('beforeend',`<div class="bubble user-b">${esc(text)}</div>`);$('send').disabled=true;$('send').textContent='考え中…';try{const fn=httpsCallable(functions,'chatReply');const r=await fn({workId:w.id,chatId:activeChat,userText:text,length:$('length').value,regenerateFrom});const id=crypto.randomUUID();c.insertAdjacentHTML('beforeend',`<div class="bubble ai-b" data-text="${esc(r.data.text)}">${esc(r.data.text)}<div class="tools"><button class="tool regen" data-id="${id}">↻ 再生成</button><button class="tool copy">📋 コピー</button><button class="tool report">⚠️ 報告</button></div></div>`);$('chatInput').value='';c.scrollTop=c.scrollHeight;const last=c.lastElementChild;last.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(r.data.text);last.querySelector('.regen').onclick=()=>{ $('chatInput').value=text; sendChat(w,r.data.text)};last.querySelector('.report').onclick=async()=>{await addDoc(collection(db,'reports'),{uid:user.uid,workId:w.id,text:r.data.text,reason:'AI返答',createdAt:serverTimestamp()});alert('報告しました。')}}catch(e){alert('AI接続の設定後に使えます。\n'+e.message)}finally{$('send').disabled=false;$('send').textContent='送信'}}
$('spin').onclick=async()=>{const m=$('machine');m.classList.add('spinning');$('spin').disabled=true;try{const fn=httpsCallable(functions,'spinGacha');const r=await fn({});setTimeout(()=>{m.classList.remove('spinning');$('gachaResult').classList.remove('hidden');$('gachaResult').innerHTML=`<h2 class="title">${esc(r.data.item.rarity)}</h2><p style="text-align:center">${esc(r.data.item.name)}</p>`;profile.tickets=r.data.tickets;renderProfile();if(sound)new Audio('assets/applause.mp3').play().catch(()=>{})},1100)}catch(e){m.classList.remove('spinning');alert(e.message)}finally{setTimeout(()=>$('spin').disabled=false,1200)}};
$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
</script></body></html>

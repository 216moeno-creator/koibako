<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恋ばこ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#3b0016;
    color:#d4af37;
    font-family:sans-serif;
}

.screen{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

h1{
    font-size:60px;
    margin-bottom:10px;
}

p{
    color:white;
    font-size:22px;
    margin-bottom:40px;
}

button{
    padding:18px 45px;
    border:none;
    border-radius:50px;
    font-size:22px;
    font-weight:bold;
    background:#d4af37;
    color:#3b0016;
}

button:hover{
    transform:scale(1.05);
}

#game{
    display:none;
    background:#f5f5f5;
    color:black;
}

.chat{
    width:90%;
    max-width:700px;
    height:70vh;
    background:white;
    border-radius:20px;
    overflow:auto;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

.message{
    margin:15px 0;
    padding:12px;
    background:#ffe8f0;
    border-radius:12px;
}

input{
    width:75%;
    padding:15px;
    border-radius:30px;
    border:1px solid #ccc;
    margin-top:20px;
}

.send{
    margin-left:10px;
}
</style>

</head>

<body>

<div id="title" class="screen">

<h1>恋ばこ</h1>

<p>恋の幕が、いま開く。</p>

<button onclick="startGame()">入場する</button>

</div>

<div id="game" class="screen">

<h2 style="margin-bottom:20px;">恋ばこ チャット</h2>

<div class="chat" id="chat">

<div class="message">
ようこそ、恋ばこの世界へ。
</div>

</div>

<div>

<input id="text" placeholder="メッセージを入力">

<button class="send" onclick="sendMessage()">
送信
</button>

</div>

</div>

<script>

function startGame(){

document.getElementById("title").style.display="none";
document.getElementById("game").style.display="flex";

}

function sendMessage(){

let input=document.getElementById("text");

if(input.value=="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="message">
${input.value}
</div>
`;

chat.scrollTop=chat.scrollHeight;

input.value="";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b0016">

<title>恋ばこ</title>

<link rel="icon" href="file_000000006e8882119118b07309fcc222.png">
<link rel="apple-touch-icon" href="file_000000006e8882119118b07309fcc222.png">

<style>
:root{
  --wine:#3b0016;
  --red:#a90028;
  --gold:#e8c262;
  --light-gold:#fff1ad;
  --cream:#fff8e8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--wine);
  color:var(--cream);
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
}

button{
  font:inherit;
}

/* 開幕画面 */
#opening{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 38%,#7c1539 0%,#430017 46%,#1c0009 100%);
  transition:opacity .8s,visibility .8s;
}

#opening.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.opening-card{
  width:min(90vw,520px);
  padding:48px 22px;
  text-align:center;
  border:2px solid var(--gold);
  border-radius:28px;
  background:rgba(255,255,255,.035);
  box-shadow:
    0 0 0 7px rgba(232,194,98,.08),
    0 25px 70px rgba(0,0,0,.55),
    inset 0 0 35px rgba(255,226,135,.06);
}

.ornament{
  color:var(--gold);
  font-size:25px;
  letter-spacing:10px;
}

.logo{
  margin:12px 0 8px;
  font-size:clamp(55px,16vw,90px);
  letter-spacing:.08em;
  line-height:1.2;
  color:transparent;
  background:linear-gradient(
    180deg,
    #fffbd1 0%,
    #edc75f 35%,
    #a96e16 68%,
    #ffe99a 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  filter:drop-shadow(0 3px 1px #4e2300);
}

.catch{
  margin:0;
  color:#fff5e6;
  font-size:clamp(16px,4.5vw,21px);
  letter-spacing:.1em;
}

#enterButton{
  position:relative;
  margin-top:38px;
  min-width:190px;
  padding:17px 38px;
  overflow:hidden;
  border:1px solid #fff2af;
  border-radius:999px;
  color:#3b0016;
  background:linear-gradient(#fff3b6,#d5a83d 62%,#f2d77f);
  box-shadow:
    0 9px 24px rgba(0,0,0,.38),
    inset 0 1px 2px #fffce1,
    0 0 15px rgba(255,225,128,.35);
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  transition:transform .2s,box-shadow .25s;
}

#enterButton::before{
  content:"";
  position:absolute;
  top:-70%;
  left:-45%;
  width:35%;
  height:240%;
  transform:rotate(25deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.95),
    transparent
  );
  animation:buttonShine 2.8s infinite;
}

#enterButton:active{
  transform:scale(.95);
  box-shadow:0 0 35px rgba(255,236,153,.95);
}

#enterButton.clicked{
  animation:buttonFlash .65s ease;
}

@keyframes buttonShine{
  0%{left:-55%}
  55%,100%{left:125%}
}

@keyframes buttonFlash{
  0%{transform:scale(1)}
  40%{transform:scale(1.09);filter:brightness(1.7)}
  100%{transform:scale(1)}
}

/* カーテン */
#curtainLayer{
  position:fixed;
  inset:0;
  z-index:90;
  visibility:hidden;
  pointer-events:none;
  overflow:hidden;
}

#curtainLayer.show{
  visibility:visible;
}

.curtain{
  position:absolute;
  top:0;
  width:51%;
  height:100%;
  background:
    repeating-linear-gradient(
      90deg,
      #4b000e 0,
      #9c0024 8%,
      #d51d3e 16%,
      #80001c 27%,
      #3f000b 38%
    );
  box-shadow:inset 0 0 60px rgba(0,0,0,.55);
  transition:transform 1.8s cubic-bezier(.65,.01,.22,1);
}

.curtain::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.18),
    transparent 24%,
    rgba(0,0,0,.28)
  );
}

.curtain-left{
  left:0;
  border-right:4px solid #e4b84f;
}

.curtain-right{
  right:0;
  border-left:4px solid #e4b84f;
}

#curtainLayer.open .curtain-left{
  transform:translateX(-98%);
}

#curtainLayer.open .curtain-right{
  transform:translateX(98%);
}

.curtain-top{
  position:absolute;
  top:0;
  left:0;
  z-index:4;
  width:100%;
  height:12%;
  background:
    repeating-linear-gradient(
      90deg,
      #4b000e 0,
      #ae0028 8%,
      #630016 17%
    );
  border-bottom:5px solid #d8a83d;
  border-radius:0 0 48% 48%;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}

/* キラキラ */
#sparkles{
  position:absolute;
  inset:0;
  z-index:5;
  overflow:hidden;
}

.sparkle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff5b5;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #ffd75e,
    0 0 28px #fff0a0;
  opacity:0;
  animation:sparkleMove 1.5s ease-out forwards;
}

@keyframes sparkleMove{
  0%{
    opacity:0;
    transform:translateY(15px) scale(.2) rotate(0);
  }
  25%{opacity:1}
  100%{
    opacity:0;
    transform:translateY(-100px) scale(1.8) rotate(180deg);
  }
}

/* ロビー */
#app{
  display:none;
  min-height:100vh;
}

#app.show{
  display:block;
}

.lobby{
  position:relative;
  min-height:100vh;
  padding:20px 15px 105px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 9%,rgba(255,225,139,.2),transparent 24%),
    linear-gradient(180deg,#251137 0%,#4a1b4f 46%,#19081d 100%);
}

.lobby-content{
  position:relative;
  z-index:2;
  width:min(100%,1050px);
  margin:auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.mini-logo{
  color:var(--light-gold);
  font-size:25px;
  font-weight:bold;
  text-shadow:0 2px 3px #401c00;
}

.time{
  padding:7px 12px;
  border:1px solid rgba(255,231,161,.45);
  border-radius:999px;
  color:#ffeab3;
  background:rgba(30,0,25,.45);
  font-size:13px;
}

/* シャンデリア */
.chandelier-space{
  position:relative;
  height:165px;
  display:flex;
  justify-content:center;
}

.chain{
  width:4px;
  height:50px;
  background:linear-gradient(#83500d,#fff1a6,#83500d);
}

.chandelier{
  position:absolute;
  top:47px;
  width:230px;
  height:105px;
  animation:glow 2.8s ease-in-out infinite;
}

.center-piece{
  position:absolute;
  left:50%;
  top:0;
  width:21px;
  height:75px;
  transform:translateX(-50%);
  border-radius:50%;
  background:linear-gradient(90deg,#976313,#fff3ae,#976313);
}

.arm{
  position:absolute;
  top:32px;
  width:88px;
  height:45px;
  border-bottom:5px solid #dfb44d;
  border-radius:0 0 55% 55%;
}

.arm.left{right:50%}
.arm.right{left:50%}

.lamp{
  position:absolute;
  width:15px;
  height:27px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 25%,#fff 0 15%,#fff0a6 38%,#d5921b 78%);
  box-shadow:0 0 24px #ffe390;
}

.l1{left:5px;top:48px}
.l2{left:55px;top:68px}
.l3{left:107px;top:80px}
.l4{right:55px;top:68px}
.l5{right:5px;top:48px}

@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 10px rgba(255,219,119,.6))}
  50%{filter:drop-shadow(0 0 27px rgba(255,238,166,1))}
}

/* 劇場ホール */
.theater{
  position:relative;
  min-height:440px;
  overflow:hidden;
  border:2px solid rgba(237,196,94,.78);
  border-radius:30px 30px 15px 15px;
  background:
    radial-gradient(circle at 50% 20%,rgba(126,74,186,.26),transparent 36%),
    linear-gradient(#2c153e,#441a45 58%,#210b27);
  box-shadow:
    0 24px 60px rgba(0,0,0,.48),
    inset 0 0 45px rgba(255,212,105,.08);
}

.stained-glass{
  position:absolute;
  top:22px;
  left:50%;
  width:min(58vw,320px);
  height:275px;
  transform:translateX(-50%);
  overflow:hidden;
  border:10px solid #d5ac50;
  border-radius:50% 50% 12px 12px;
  background:
    conic-gradient(
      #f36e9f,
      #8b63d5,
      #48b9e6,
      #f8ce58,
      #ea657e,
      #8060c9,
      #4dc6e8,
      #f36e9f
    );
  box-shadow:
    0 0 38px rgba(161,112,255,.7),
    inset 0 0 28px rgba(255,255,255,.5);
}

.stained-glass::before,
.stained-glass::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 47%,#bf9441 48% 52%,transparent 53%),
    linear-gradient(transparent 47%,#bf9441 48% 52%,transparent 53%);
}

.stained-glass::after{
  transform:rotate(45deg) scale(1.5);
}

.stairs{
  position:absolute;
  left:50%;
  bottom:0;
  width:94%;
  height:270px;
  transform:translateX(-50%);
}

.stair{
  position:absolute;
  bottom:0;
  width:46%;
  height:100%;
  background:
    repeating-linear-gradient(
      180deg,
      #f2dfad 0 15px,
      #aa8545 16px 20px
    );
}

.stair.left{
  left:0;
  clip-path:polygon(0 100%,0 55%,100% 0,100% 100%);
}

.stair.right{
  right:0;
  clip-path:polygon(0 0,100% 55%,100% 100%,0 100%);
}

.carpet{
  position:absolute;
  left:50%;
  bottom:0;
  width:37%;
  height:205px;
  transform:translateX(-50%);
  clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);
  background:
    linear-gradient(90deg,#4c000c,#ae1430 30%,#d72a47 50%,#ae1430 70%,#4c000c);
  box-shadow:0 0 30px rgba(197,12,54,.55);
}

.welcome{
  position:relative;
  z-index:4;
  padding:310px 15px 25px;
  text-align:center;
  text-shadow:0 3px 8px #000;
}

.welcome h1{
  margin:0;
  color:#ffe8a3;
  font-size:clamp(30px,8vw,50px);
}

.welcome p{
  margin:10px 0 0;
  line-height:1.8;
}

/* メニュー */
.heading{
  margin:30px 0 15px;
  text-align:center;
  color:#ffe8a3;
  font-size:27px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.card{
  padding:20px 12px;
  border:1px solid rgba(255,226,143,.55);
  border-radius:18px;
  text-align:center;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,221,129,.16),transparent 42%),
    linear-gradient(145deg,rgba(102,0,38,.87),rgba(28,6,35,.96));
  box-shadow:0 10px 26px rgba(0,0,0,.35);
}

.card span{
  display:block;
  font-size:34px;
}

.card strong{
  display:block;
  margin-top:7px;
  color:#ffe5a0;
  font-size:18px;
}

.card small{
  display:block;
  margin-top:7px;
  color:#decbd4;
  line-height:1.5;
}

.message{
  margin-top:25px;
  padding:22px 17px;
  border:1px solid rgba(255,226,143,.5);
  border-radius:18px;
  text-align:center;
  background:rgba(255,255,255,.055);
}

.message h3{
  margin:0 0 10px;
  color:#ffe6a0;
}

.message p{
  margin:0;
  line-height:1.8;
}

/* PC */
@media(min-width:760px){
  .cards{
    grid-template-columns:repeat(4,1fr);
  }

  .theater{
    min-height:520px;
  }

  .stained-glass{
    width:380px;
    height:330px;
  }

  .welcome{
    padding-top:385px;
  }
}
</style>
</head>

<body>

<section id="opening">
  <div class="opening-card">
    <div class="ornament">◆ ✦ ◆</div>
    <h1 class="logo">恋ばこ</h1>
    <p class="catch">恋を開けば、物語が始まる。</p>
    <button id="enterButton">入場する</button>
  </div>
</section>

<div id="curtainLayer">
  <div class="curtain-top"></div>
  <div class="curtain curtain-left"></div>
  <div class="curtain curtain-right"></div>
  <div id="sparkles"></div>
</div>

<main id="app">
  <div class="lobby">
    <div class="lobby-content">

      <header class="topbar">
        <div class="mini-logo">恋ばこ</div>
        <div class="time" id="timeLabel">劇場準備中</div>
      </header>

      <div class="chandelier-space">
        <div class="chain"></div>

        <div class="chandelier">
          <div class="center-piece"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="lamp l1"></div>
          <div class="lamp l2"></div>
          <div class="lamp l3"></div>
          <div class="lamp l4"></div>
          <div class="lamp l5"></div>
        </div>
      </div>

      <section class="theater">
        <div class="stained-glass"></div>

        <div class="stairs">
          <div class="stair left"></div>
          <div class="stair right"></div>
          <div class="carpet"></div>
        </div>

        <div class="welcome">
          <h1>おかえりなさい</h1>
          <p>
            ここは、恋と夢と希望が集まる劇場。<br>
            今日は、どんな物語を始めますか？
          </p>
        </div>
      </section>

      <h2 class="heading">本日の演目</h2>

      <section class="cards">
        <article class="card">
          <span>🌹</span>
          <strong>恋</strong>
          <small>甘い恋、秘密の恋、運命の恋</small>
        </article>

        <article class="card">
          <span>🎭</span>
          <strong>夢</strong>
          <small>夢を追い続ける人の物語</small>
        </article>

        <article class="card">
          <span>🌟</span>
          <strong>希望</strong>
          <small>明日への一歩を後押しする物語</small>
        </article>

        <article class="card">
          <span>🪽</span>
          <strong>癒やし</strong>
          <small>一人ではないと思える時間</small>
        </article>
      </section>

      <section class="message">
        <h3>今日の言葉</h3>
        <p id="dailyMessage"></p>
      </section>

    </div>
  </div>
</main>

<script>
const opening = document.getElementById("opening");
const enterButton = document.getElementById("enterButton");
const curtainLayer = document.getElementById("curtainLayer");
const app = document.getElementById("app");
const sparkleArea = document.getElementById("sparkles");

function speakAnnouncement(){
  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const message =
    "皆さま、本日は恋ばこ劇場へお越しいただき、ありがとうございます。間もなく、物語の幕が上がります。どうぞ、ごゆっくりお楽しみください。";

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = "ja-JP";
  utterance.rate = 0.9;
  utterance.pitch = 1.05;
  utterance.volume = 1;

  const voices = speechSynthesis.getVoices();
  const japaneseVoice = voices.find(voice =>
    voice.lang && voice.lang.toLowerCase().startsWith("ja")
  );

  if(japaneseVoice){
    utterance.voice = japaneseVoice;
  }

  speechSynthesis.speak(utterance);
}

function makeSparkles(){
  sparkleArea.innerHTML = "";

  for(let i = 0; i < 55; i++){
    const sparkle = document.createElement("span");
    sparkle.className = "sparkle";

    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = 20 + Math.random() * 75 + "%";
    sparkle.style.animationDelay = Math.random() * 0.8 + "s";
    sparkle.style.animationDuration = 0.9 + Math.random() * 1.2 + "s";
    sparkle.style.width = 4 + Math.random() * 8 + "px";
    sparkle.style.height = sparkle.style.width;

    sparkleArea.appendChild(sparkle);
  }
}

enterButton.addEventListener("click", () => {
  enterButton.classList.add("clicked");
  speakAnnouncement();

  curtainLayer.classList.add("show");
  makeSparkles();

  setTimeout(() => {
    opening.classList.add("hide");
    app.classList.add("show");
  }, 250);

  setTimeout(() => {
    curtainLayer.classList.add("open");
  }, 650);

  setTimeout(() => {
    curtainLayer.classList.remove("show","open");
    sparkleArea.innerHTML = "";
  }, 2700);
});

function updateTime(){
  const hour = new Date().getHours();
  const label = document.getElementById("timeLabel");

  if(hour >= 5 && hour < 12){
    label.textContent = "朝の劇場";
  }else if(hour >= 12 && hour < 17){
    label.textContent = "昼の劇場";
  }else if(hour >= 17 && hour < 20){
    label.textContent = "夕暮れの劇場";
  }else{
    label.textContent = "夜の劇場";
  }
}

const messages = [
  "夢は一日では叶わない。でも、一歩は今日踏み出せる。",
  "あなたは一人ではありません。この劇場は、いつでも待っています。",
  "立ち止まる日があってもいい。物語は、まだ終わっていません。",
  "推しからもらった勇気は、いつか誰かを照らす光になります。",
  "生きて今日を迎えたこと。それだけでも、十分に素晴らしい。",
  "今日ここへ来てくれたことも、あなたの物語の大切な一幕です。"
];

updateTime();

const index = new Date().getDate() % messages.length;
document.getElementById("dailyMessage").textContent = messages[index];
</script>

</body>
</html>

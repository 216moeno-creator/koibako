<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>恋ばこ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
}

body{

background:url("title.jpg") center center / cover no-repeat;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.overlay{

width:100%;
height:100%;
background:rgba(0,0,0,.45);

display:flex;
justify-content:center;
align-items:center;

}

.box{

text-align:center;
color:white;
padding:20px;

}

.logo{

font-size:64px;
font-weight:bold;
color:#f6d36b;
text-shadow:0 0 18px gold;

}

.sub{

margin-top:15px;
font-size:18px;
letter-spacing:3px;

}

.notice{

margin-top:60px;
font-size:14px;
color:#ffe7a4;

}

button{

margin-top:20px;

width:230px;
height:65px;

border:none;
border-radius:50px;

font-size:24px;
font-weight:bold;

color:#4b0000;

background:linear-gradient(#fff2a8,#d8a52e);

box-shadow:0 0 20px gold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 35px gold;

}

</style>

</head>

<body>

<div class="overlay">

<div class="box">

<div class="logo">
恋ばこ
</div>

<div class="sub">
恋を開けば、物語が始まる。
</div>

<div class="notice">

🔊 音声演出が再生されます。<br>
音量にご注意ください。

</div>

<button>

入場する

</button>

</div>

</div>

</body>
</html>
